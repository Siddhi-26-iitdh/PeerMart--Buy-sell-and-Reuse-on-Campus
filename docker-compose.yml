services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: peermart
      MYSQL_USER: peermart
      MYSQL_PASSWORD: ${DB_PASSWORD:-peermart}
    ports:
      - "3306:3306"
    volumes:
      - peermart_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -e 'SELECT 1' $$MYSQL_DATABASE"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://peermart:${DB_PASSWORD:-peermart}@db:3306/peermart?charset=utf8mb4
      PEERMART_DEMO_PASSWORD: ${PEERMART_DEMO_PASSWORD:-PeerMart@2026Demo!}
      PEERMART_SESSION_SECRET: ${PEERMART_SESSION_SECRET:-peermart-local-development-only-change-before-deployment}
      PEERMART_UPLOAD_DIR: /app/uploads
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-6.0}
      AI_SEARCH_RATE_LIMIT_PER_MIN: ${AI_SEARCH_RATE_LIMIT_PER_MIN:-10}
    volumes:
      - peermart_uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/app/start.sh"]
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "8444:80"

volumes:
  peermart_mysql_data:
  peermart_uploads_data:
