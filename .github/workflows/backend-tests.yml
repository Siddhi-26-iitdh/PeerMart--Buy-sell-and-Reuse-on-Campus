name: Backend Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint, MySQL Tests and Coverage
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: peermart_test
          MYSQL_USER: peermart
          MYSQL_PASSWORD: peermart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u peermart -ppeermart"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql+pymysql://peermart:peermart@127.0.0.1:3306/peermart_test
      TEST_DATABASE_URL: mysql+pymysql://peermart:peermart@127.0.0.1:3306/peermart_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run Ruff linting
        run: python -m ruff check app/ tests/ alembic/ seed.py

      - name: Apply MySQL database migrations
        run: python -m alembic upgrade head

      - name: Run tests and enforce coverage
        run: |
          python -m pytest tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          if-no-files-found: warn
